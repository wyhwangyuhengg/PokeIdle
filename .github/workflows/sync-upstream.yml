# 自动同步上游仓库（ZTMYO/PokeIdle）到当前 fork
# 每 30 分钟检查一次，也支持手动触发
# 同步成功后显式触发 Pages 部署 workflow

name: Sync Fork with Upstream

on:
  schedule:
    # 每 30 分钟运行一次（分钟 0 和 30，每小时，每天）
    - cron: '0,30 * * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点运行

permissions:
  contents: write
  actions: write # 需要用来触发部署 workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/ZTMYO/PokeIdle.git
          git fetch upstream

      # 判断上游是否有 fork 还没有的新提交
      - name: Check upstream for new commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main main; then
            echo "sync_needed=false" >> $GITHUB_OUTPUT
          else
            echo "sync_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream main
        if: steps.check.outputs.sync_needed == 'true'
        run: |
          git checkout main
          git merge upstream/main --no-edit

      - name: Push to fork
        if: steps.check.outputs.sync_needed == 'true'
        run: git push origin main

      # 关键：GITHUB_TOKEN 的 push 不会触发其他 workflow，
      # 所以必须显式触发部署 workflow（workflow_dispatch 是例外，会被执行）
      # 注意：用文件名 deploy-pages.yml 而不是 workflow 名称，
      #       gh 按带空格的中文/英文名称匹配经常找不到
      - name: Trigger Pages deployment
        if: steps.check.outputs.sync_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref main
